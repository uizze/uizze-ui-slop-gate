name: Verify Action

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run verify
      - name: Exercise packaged Action
        uses: ./
        with:
          files: test/fixtures/problematic.tsx
          fail-on: never
          show-uizze-link: "false"
